<!doctype html>
<html lang="ko"><head><meta name="robots" content="noindex,nofollow,noarchive,nosnippet,noai,noimageai"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>연습 기록 관리 | 실전 롤플레이</title>
<style>
@font-face{font-family:'Freesentation';src:url('../fonts/Freesentation-4Regular.ttf') format('truetype');font-weight:400}
@font-face{font-family:'Freesentation';src:url('../fonts/Freesentation-7Bold.ttf') format('truetype');font-weight:700}
:root{--ink:#0a0b0d;--sub:#5b616e;--line:#dee1e6;--bg:#f7f8fa;--card:#fff;--acc:#0052FF}
*{box-sizing:border-box}
body{margin:0;font-family:'Freesentation',system-ui,sans-serif;background:var(--bg);color:var(--ink);font-size:15px;line-height:1.55}
[hidden]{display:none!important}
.wrap{max-width:1040px;margin:0 auto;padding:22px 16px 60px}
a.back{font-size:13px;color:var(--sub);text-decoration:none}
h1{margin:4px 0 6px;font-size:clamp(24px,3.2vw,30px);letter-spacing:-.02em}
.lead{margin:0 0 14px;color:var(--sub)}
.panel{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:16px 18px;margin-bottom:14px}
input,select{font:inherit;font-size:14px;padding:8px 10px;border:1px solid var(--line);border-radius:12px;background:#fff}
.btn{font:inherit;font-size:13px;padding:7px 14px;border-radius:100px;border:1px solid var(--line);background:#fff;cursor:pointer;color:inherit;text-decoration:none;display:inline-block;white-space:nowrap}
.btn.pri{background:var(--ink);color:#fff;border-color:var(--ink)}
.bar{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.tbl{width:100%;border-collapse:collapse;font-size:14px}
.tbl th,.tbl td{padding:9px 8px;border-top:1px solid var(--line);text-align:left;vertical-align:middle}
.tbl th{font-size:12.5px;color:var(--sub);font-weight:400;border-top:0}
.tbl tr.on td{background:rgba(0,82,255,.05)}
.scroll{overflow-x:auto}
.detail{border-top:1px solid var(--line);padding:12px 4px}
.detail audio{width:100%;margin:6px 0 10px}
.talk p{margin:4px 0}.talk b{display:inline-block;width:44px;color:var(--sub);font-weight:700}
pre{white-space:pre-wrap;font:inherit;background:var(--bg);border-radius:12px;padding:12px;margin:8px 0 0}
.note{font-size:13px;color:var(--sub)}
.err{color:#E5322D;font-size:14px}
</style></head>
<body>
<!-- 4&7 NEXT 입구 (build_site.py가 모든 페이지 body 맨 앞에 넣음. ../config.json = config.json 경로)
     11/23: 개인 아이디 추가. 브라우저에는 «아이디:비밀번호» 를 team_pass 로 기억 (팀 공용 비밀번호는 아이디 없이) -->
<div id="g47" style="position:fixed;inset:0;z-index:2147483000;background:#0a0b0d;display:grid;place-items:center;font-family:Pretendard,'Malgun Gothic',system-ui,sans-serif">
  <form id="g47f" style="background:#fff;border:0;border-radius:24px;padding:28px 26px;width:min(340px,calc(100vw - 32px));box-shadow:0 6px 24px rgba(0,0,0,.06)">
    <div style="font-weight:800;font-size:20px;color:#0a0b0d">4&amp;7 NEXT</div>
    <div style="color:#5f6b66;font-size:14px;margin:6px 0 16px">받으신 아이디와 비밀번호를 넣어 주세요.</div>
    <input id="g47i" type="text" autocomplete="username" autocapitalize="off" spellcheck="false" placeholder="아이디 (예: 홍길동)" style="width:100%;box-sizing:border-box;padding:11px 12px;border:1px solid #dee1e6;border-radius:12px;font-size:16px;margin-bottom:8px">
    <input id="g47p" type="password" autocomplete="current-password" placeholder="비밀번호" style="width:100%;box-sizing:border-box;padding:11px 12px;border:1px solid #dee1e6;border-radius:12px;font-size:16px">
    <label style="display:flex;gap:6px;align-items:center;margin-top:10px;color:#5f6b66;font-size:13px"><input type="checkbox" id="g47k"> 이 기기에서 로그인 유지</label>
    <button type="submit" style="margin-top:10px;width:100%;padding:11px;border:0;border-radius:100px;background:#0052FF;color:#fff;font-size:15px;font-weight:700;cursor:pointer">들어가기</button>
    <div id="g47m" style="color:#E5322D;font-size:13px;margin-top:8px;min-height:1em"></div>
    <div style="color:#8a938f;font-size:12px;margin-top:4px">운영진도 받은 아이디와 비밀번호로 들어오면 관리 메뉴가 함께 보여요.</div>
  </form>
</div>
<script>(function(){var K='team_pass',CFG='../config.json',g=document.getElementById('g47'),m=document.getElementById('g47m'),v='';
/* 11/24 상권 «한 번 로그인하면 자동으로 되는 게 불편»: «로그인 유지»를 안 고르면 브라우저(창)를 닫으면 다시 로그인 */
try{var sm=location.search.match(/[?&]s=([a-z0-9]{8,20})/);if(sm){localStorage.setItem(K,sm[1]);localStorage.setItem('g47keep','1');sessionStorage.setItem('g47s','1');['team_id','team_name','team_staff'].forEach(function(k){localStorage.removeItem(k)});
  history.replaceState(null,'',location.pathname+location.search.replace(/([?&])s=[a-z0-9]{8,20}&?/,'$1').replace(/[?&]$/,'')+location.hash)}}catch(e){}
try{if(localStorage.getItem('g47keep')!=='1'&&!sessionStorage.getItem('g47s')){['team_pass','team_id','team_name','team_staff','hub-me'].forEach(function(k){localStorage.removeItem(k)})}}catch(e){}
try{v=localStorage.getItem(K)||''}catch(e){}
function ep(){return fetch(CFG,{cache:'no-store'}).then(function(r){return r.json()}).then(function(j){return String(j.endpoint||'').trim()}).catch(function(){return ''})}
var dv='';try{dv=localStorage.getItem('g47dv')||'';if(!dv){dv=Math.random().toString(36).slice(2,10);localStorage.setItem('g47dv',dv)}}catch(e){}
function keep(j){try{if(j&&j.id){localStorage.setItem('team_id',j.id);localStorage.setItem('team_name',j.name||j.id);
  var me=null;try{me=JSON.parse(localStorage.getItem('hub-me')||'null')}catch(e){}
  localStorage.setItem('hub-me',JSON.stringify({name:j.name,branch:j.branch||(j.staff?'운영진':''),boss:!!j.boss,staff:!!j.staff,id:j.id}))}
  else{localStorage.removeItem('team_id');localStorage.removeItem('team_name')}
  if(j&&j.staff)localStorage.setItem('team_staff','1');else localStorage.removeItem('team_staff')}catch(e){}}
function check(p,k){var pg=(location.pathname.split('/').filter(Boolean).pop()||'hub')+(location.hash||'').slice(0,20);return ep().then(function(e){if(!e)return null;return fetch(e+'?action=passcheck&pass='+encodeURIComponent(p)+'&k='+(k||'auto')+'&pg='+encodeURIComponent(pg)+'&dv='+dv+'&r='+Date.now()).then(function(r){return r.json()}).then(function(j){if(j&&j.ok)keep(j);return j&&j.ok?true:false}).catch(function(){return null})})}
function openTry(){if(/^#login/.test(location.hash))return Promise.resolve(false);
  return ep().then(function(e){if(!e)return false;return fetch(e+'?action=passcheck&pass=&k=open&pg='+encodeURIComponent((location.pathname.split('/').filter(Boolean).pop()||'hub')+(location.hash||'').slice(0,20))+'&dv='+dv+'&r='+Date.now()).then(function(r){return r.json()}).then(function(j){
    if(j&&j.ok&&j.open&&j.key){try{localStorage.setItem(K,j.key);localStorage.setItem('g47keep','1');sessionStorage.setItem('g47s','1');['team_id','team_name','team_staff','hub-me'].forEach(function(k){localStorage.removeItem(k)})}catch(e){}return true}return false}).catch(function(){return false})})}
if(v){g.style.display='none';check(v).then(function(ok){if(ok===false){try{localStorage.removeItem(K)}catch(e){}openTry().then(function(o){if(o){location.reload()}else{g.style.display='grid';m.textContent='비밀번호가 바뀌었어요. 다시 넣어 주세요.'}})}})}
else{g.style.visibility='hidden';openTry().then(function(o){if(o){g.style.display='none';location.reload()}else{g.style.visibility='visible';var i=document.getElementById('g47i');if(i)i.focus()}})}
document.getElementById('g47f').addEventListener('submit',function(e){e.preventDefault();var id=document.getElementById('g47i').value.trim().toLowerCase(),p=document.getElementById('g47p').value.trim();if(!p)return;var t=id?id+':'+p:p;m.style.color='#5f6b66';m.textContent='확인 중…';
  check(t,'new').then(function(ok){if(ok===false){m.style.color='#c0392b';m.textContent=id?'아이디 또는 비밀번호가 맞지 않아요.':'비밀번호가 맞지 않아요.';return}
    if(ok===null){m.style.color='#c0392b';m.textContent='연결하지 못했어요. 잠시 후 다시 시도해 주세요.';return}
    try{localStorage.setItem(K,t);sessionStorage.setItem('g47s','1');localStorage.setItem('g47keep',document.getElementById('g47k').checked?'1':'0')}catch(e){}g.style.display='none';try{location.reload()}catch(e){}})});
})();</script>
<div class="wrap">
<a class="back" href="../#tool-rplive" target="_top">← 실전 롤플레이로 돌아가기</a>
<h1>연습 기록 관리</h1>
<p class="lead">지점장 비밀번호(보험 MBTI 기록 보기와 같은 번호)로 들어와요. 지점원들이 연습한 녹음·대화록·피드백을 듣고 내려받습니다.</p>

<section class="panel" id="login">
  <div class="bar"><input id="code" type="password" placeholder="지점장 비밀번호" autocomplete="off"><button class="btn pri" id="go">들어가기</button></div>
  <p class="err" id="err"></p>
  <p class="note">녹음·대화록은 허브 담당 구글 드라이브(나만 보기)에 저장되고, 이 화면에서만 들을 수 있어요.</p>
</section>

<section id="main" hidden>
  <div class="panel">
    <div class="bar">
      <b id="me"></b>
      <input id="q" placeholder="연습자 이름으로 찾기" style="flex:1;min-width:160px"><input id="br" placeholder="소속 지점으로 찾기" style="flex:1;min-width:140px">
      <select id="st"><option value="">모든 단계</option><option value="TA">TA 전화 약속</option><option value="AP">AP 첫 미팅</option><option value="PC">PC 제안</option><option value="CL">클로징</option></select>
      <button class="btn" id="reload">새로 고침</button><button class="btn" id="out">나가기</button>
    </div>
  </div>
  <div class="panel scroll"><table class="tbl"><thead><tr><th>날짜</th><th>연습자</th><th>지점</th><th>단계</th><th>점수</th><th>길이</th><th>녹음</th><th></th></tr></thead><tbody id="rows"></tbody></table>
  <p class="note" id="cnt"></p></div>
</section>
</div>
<script>
const $ = id => document.getElementById(id), esc = s => String(s == null ? '' : s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const SN = { TA: 'TA 전화 약속', AP: 'AP 첫 미팅', PC: 'PC 제안', CL: '클로징' };
let CODE = '', items = [], open = '';
try { CODE = sessionStorage.getItem('rp_admin') || ''; } catch (e) {}
const EP = 'https://script.google.com/macros/s/AKfycbyIF7r-0sSli3iIURIsnNQRefQU1lBbLo0iGA7lcraRYIlM-atbwNc-skKfC9dgU3nM2Q/exec';
const api = (sub, o) => fetch(EP, { method: 'POST', body: JSON.stringify(Object.assign({ action: 'rp2', sub, mgr: CODE }, o || {})) }).then(x => x.json()).catch(() => ({}));
const b64blob = j => { const s = atob(j.b64), u = new Uint8Array(s.length); for (let i = 0; i < s.length; i++) u[i] = s.charCodeAt(i); return new Blob([u], { type: j.mime }); };
const mm = s => s ? Math.floor(s / 60) + '분 ' + String(Math.round(s % 60)).padStart(2, '0') + '초' : '-';
async function enter(){
  const r = CODE ? await api('me') : {};
  if (!r.ok) { $('err').textContent = CODE ? (r.error || '들어가지 못했어요.') : ''; $('login').hidden = false; $('main').hidden = true; return; }
  try { sessionStorage.setItem('rp_admin', CODE); } catch (e) {}
  $('login').hidden = true; $('main').hidden = false; $('me').textContent = r.name + ' 님'; load();
}
async function load(){ const r = await api('list'); items = r.items || []; draw(); }
function draw(){
  const q = $('q').value.trim(), st = $('st').value, bq = $('br').value.trim();
  const list = items.filter(x => (!q || (x.who || '').includes(q)) && (!st || x.stage === st) && (!bq || (x.branch || '').includes(bq)));
  $('rows').innerHTML = list.map(x => `<tr data-r="${esc(x.rid)}" class="${open === x.rid ? 'on' : ''}"><td>${esc(x.saved)}</td><td>${esc(x.who)}</td><td>${esc(x.branch || '-')}</td><td>${esc(SN[x.stage] || x.stage)}</td><td>${x.score === '' || x.score == null ? '-' : esc(x.score)}</td><td>${mm(x.total)}</td><td>${x.audio ? '있음' : '-'}</td>
    <td class="bar"><button class="btn" data-open="${esc(x.rid)}">${open === x.rid ? '닫기' : '보기'}</button>${x.audio ? `<button class="btn" data-dl="audio" data-id="${esc(x.rid)}">녹음</button>` : ''}<button class="btn" data-dl="text" data-id="${esc(x.rid)}">대화록+피드백</button></td></tr>` +
    (open === x.rid ? `<tr><td colspan="8"><div class="detail" id="det">불러오는 중…</div></td></tr>` : '')).join('');
  $('cnt').textContent = `기록 ${list.length}건`;
  if (open) detail(open);
}
async function detail(rid){
  const r = await api('record', { rid }); const el = $('det'); if (!el || !r.ok) return;
  const d = r.record, src = r.audio ? await blobUrl(rid) : '';
  el.innerHTML = (src ? `<audio controls src="${src}"></audio>` : '<p class="note">녹음이 없는 기록이에요.</p>') +
    `<div class="talk">${(d.history || []).map(m => `<p><b>${m.role === 'user' ? '나' : '대표'}</b>${esc(m.text)}</p>`).join('')}</div>` +
    `<pre>${esc(d.feedback || '피드백 없음')}</pre>`;
}
async function blobUrl(rid){ const j = await api('file', { rid, kind: 'audio' }); return j.ok ? URL.createObjectURL(b64blob(j)) : ''; }
async function download(rid, kind){
  const j = await api('file', { rid, kind }); if (!j.ok) return alert(j.error || '내려받지 못했어요.');
  const a = document.createElement('a'); a.href = URL.createObjectURL(b64blob(j)); a.download = rid + (kind === 'audio' ? '.webm' : '.txt'); a.click();
}
$('rows').onclick = e => { const o = e.target.closest('[data-open]'), d = e.target.closest('[data-dl]');
  if (o) { open = open === o.dataset.open ? '' : o.dataset.open; draw(); } if (d) download(d.dataset.id, d.dataset.dl); };
$('go').onclick = () => { CODE = $('code').value.trim(); enter(); };
$('code').onkeydown = e => { if (e.key === 'Enter') $('go').click(); };
$('q').oninput = draw; $('br').oninput = draw; $('st').onchange = draw; $('reload').onclick = load;
$('out').onclick = () => { CODE = ''; try { sessionStorage.removeItem('rp_admin'); } catch (e) {} $('code').value = ''; enter(); };
enter();
</script>
</body></html>
